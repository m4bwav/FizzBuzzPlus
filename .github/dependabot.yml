# Weekly update pull requests. Merge when CI is green; read the release notes before merging a major.
# The actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
# The seven-day cooldown keeps brand-new releases out until they have had time to be pulled if bad (zizmor requires at
# least seven days on every ecosystem). From the package-modernize NuGet template; no runtime dependencies to ignore.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns:
          - "MSTest*"
  # Updates the SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
